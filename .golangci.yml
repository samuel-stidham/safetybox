version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - contextcheck
    - copyloopvar
    - cyclop
    - decorder
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - fatcontext
    - forbidigo
    - forcetypeassert
    - funlen
    - ginkgolinter
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godot
    - godox
    - goheader
    - gomoddirectives
    - gomodguard_v2
    - goprintffuncname
    - gosec
    - gosmopolitan
    - govet
    - grouper
    - importas
    - ineffassign
    - interfacebloat
    - ireturn
    - lll
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - misspell
    - mnd
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnil
    - nlreturn
    - noctx
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - tagalign
    - tagliatelle
    - testableexamples
    - testifylint
    - testpackage
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - usetesting
    - varnamelen
    - wastedassign
    - whitespace
    - wrapcheck
    - wsl_v5
    - zerologlint
  settings:
    goconst:
      ignore-tests: true
    paralleltest:
      ignore-missing: true
      ignore-missing-subtests: true
    varnamelen:
      ignore-decls:
        - w io.Writer
        - r io.Reader
        - t *testing.T
        - db *sql.DB
        - tx *sql.Tx
        - i int
        - ok bool
  exclusions:
    # Linting policy. Findings get fixed, not suppressed. When a linter
    # is wrong for a whole class of files, the exclusion lives here with
    # its justification in a comment beside it. Add nothing here without
    # one. There are no inline nolint comments, so a suppression is never
    # hidden at a call site. Production code answers to every linter,
    # with the one G204 exception below.
    # File-specific paths use the (^|/) prefix, not a leading ^, so they
    # match whether golangci-lint reports a repo-relative path or one
    # prefixed by the working directory. Running from a differently cased
    # path on a case-insensitive filesystem, such as code vs Code on
    # macOS, produces a ../../.. prefix that a ^ anchor would miss.
    rules:
      - path: _test\.go
        linters:
          # Tests often check only the error from a multi-return call,
          # and blank identifiers say so most clearly.
          - dogsled
          # Table-driven tests repeat structure on purpose. Deduping
          # them makes failures harder to read.
          - dupl
          # Tests compare and unwrap errors through testify helpers,
          # which handle wrapping themselves.
          - errorlint
          # A test that walks a full lifecycle reads best as one story.
          - funlen
          # Repeating a literal keeps each test self-contained.
          - goconst
          # Magic numbers in tests are the expected values themselves.
          - mnd
          # Preallocation gains a test fixture nothing and costs clarity.
          - prealloc
          # Test helpers keep parameters that currently receive one
          # value so the next test can vary them.
          - unparam
          # Short names like tt and tx are idiomatic inside tests.
          - varnamelen
      # G301, G302, G304 only. Tests build file paths from t.TempDir
      # and create fixtures with deliberately chosen (often loose)
      # permissions to exercise the permission checks. The rest of
      # gosec still applies to tests, including G101.
      - path: _test\.go
        text: "(G301|G302|G304)"
        linters:
          - gosec
      # G204 in one file only. The shell round-trip test deliberately
      # runs reveal's own quoted output in a real shell to prove the
      # quoting is injection-safe. G204 stays active for every other
      # test.
      - path: (^|/)cmd/review_fixes_internal_test\.go$
        text: "G204"
        linters:
          - gosec
      # wrapcheck, io.Reader.Read pass-through only. The wiping-reader
      # test double must hand the source error through verbatim, since
      # the reader under test detects end of input from it. wrapcheck
      # stays active for every other error in tests.
      - path: (^|/)internal/secret/secret_test\.go$
        text: 'sig: func \(io\.Reader\)\.Read'
        linters:
          - wrapcheck
      # G204 in cmd/exec.go only. The exec verb runs the operator's own
      # argv, which is its entire purpose, so the input is not tainted.
      # G204 stays active everywhere else in production. Within the file
      # it covers every line, current and future, so review any new
      # subprocess call added there by hand.
      - path: (^|/)cmd/exec\.go$
        text: "G204"
        linters:
          - gosec

formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - prefix(github.com/samuel-stidham/safetybox/v4)
        - default
      # Without this, gci ignores the section order above and puts
      # the prefix group last, undoing the Makefile's gci target.
      custom-order: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
